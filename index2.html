<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web - Bootstrap</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }
        .item {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .contact {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        footer {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="row">
        <div class="col-12 p-3 bg-warning text-center">
            <h4>Navbar</h4>
        </div>
    </div>

    <!-- Hero -->
    <div class="row">
        <div class="col-8 col-lg-8 p-3 mx-auto bg-danger hero">
            Hero
        </div>
    </div>

    <!-- Items -->
    <div class="row">
        <div class="col-3 col-lg-3 p-3 bg-success border border-dark item">Item 1</div>
        <div class="col-3 col-lg-3 p-3 bg-success border border-dark item">Item 2</div>
        <div class="col-3 col-lg-3 p-3 bg-success border border-dark item">Item 3</div>
        <div class="col-3 col-lg-3 p-3 bg-success border border-dark item">Item 4</div>
    </div>

    <!-- Contact -->
    <div class="row">
        <div class="col-6 col-lg-6 p-3 bg-secondary border border-light contact">Contact 1</div>
        <div class="col-6 col-lg-6 p-3 bg-secondary border border-light contact">Contact 2</div>
    </div>

    <!-- Footer -->
    <div class="row">
        <div class="col-12 p-3 bg-dark text-light text-center footer">
            <h5>Footer</h5>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
