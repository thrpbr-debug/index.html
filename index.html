<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }
        .item {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .contact {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        footer {
            min-height: 80px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="row">
        <div class="col-12 p-3 bg-warning text-center">
            <h4 class="mb-0">Navbar</h4>
        </div>
    </nav>

    <!-- Hero -->
    <div class="row">
        <div class="col-8 p-3 mx-auto bg-danger hero">
            Hero
        </div>
    </div>

    <!-- Items (4 columnas) -->
    <div class="row g-3 my-3">
        <div class="col-3">
            <div class="item bg-success border border-dark">Item 1</div>
        </div>
        <div class="col-3">
            <div class="item bg-success border border-dark">Item 2</div>
        </div>
        <div class="col-3">
            <div class="item bg-success border border-dark">Item 3</div>
        </div>
        <div class="col-3">
            <div class="item bg-success border border-dark">Item 4</div>
        </div>
    </div>

    <!-- Contact (2 columnas) -->
    <div class="row g-3 my-3">
        <div class="col-6">
            <div class="contact bg-secondary border border-light">Contact 1</div>
        </div>
        <div class="col-6">
            <div class="contact bg-secondary border border-light">Contact 2</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="row">
        <div class="col-12 p-3 bg-dark text-light text-center">
            <p class="mb-0">Footer © 2026 - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
